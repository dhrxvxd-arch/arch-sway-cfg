# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# General
set -g mouse on
set -gq allow-passthrough on
set -g visual-activity off
set -sg escape-time 0

# Reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Window and pane indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi mode
setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar
set -g status-position top
set -g status-bg colour233
set -g status-fg colour249
set -g status-right '#[fg=colour249]#(date +"%I:%M%p %m-%d-%Y")#[default]'

# Appearance
set -g mode-style "fg=colour0,bg=colour11"
set -g pane-active-border-style "fg=colour238"
set -g pane-border-style "fg=colour236"

# Sessions
bind C-j display-popup -E "tmux list-sessions -F '#{session_name}' | grep -vxF \"$(tmux display-message -p '#S')\" | fzf --reverse | xargs -r tmux switch-client -t"

bind d detach-client
bind-key C-n command-prompt -p "New session name:" "new-session -s '%%'"
