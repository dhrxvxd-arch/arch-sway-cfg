
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

set -gq allow-passthrough on

set -g mouse on
set -g visual-activity off
set -sg escape-time 0
set -g history-limit 10000
set -g focus-events on

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g automatic-rename on
set -g allow-rename off

setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=#000000,fg=#9b8d7f"

set -g status-left-length 40
set -g status-right-length 60

set -g status-left '#[fg=#000000,bg=#9b8d7f,bold] #S '

set -g window-status-format '#[fg=#9b8d7f,bg=#000000]  #I  '
set -g window-status-current-format '#[fg=#000000,bg=#9b8d7f,bold,nounderscore]  #{b:pane_current_path}  '
set -g window-status-separator ''

set -g status-right '#[fg=#9b8d7f,bg=#121212] 󰥔 %H:%M '

set -g clock-mode-colour "#9b8d7f"
set -g clock-mode-style 24

set -g pane-active-border-style "fg=#9b8d7f"
set -g pane-border-style "fg=#222222"

set -g message-style "fg=#000000,bg=#9b8d7f"
set -g message-command-style "fg=#000000,bg=#9b8d7f"
set -g mode-style "fg=#000000,bg=#9b8d7f"

set -g display-panes-colour "#444444"
set -g display-panes-active-colour "#9b8d7f"

bind C-j display-popup -E \
    "tmux list-sessions -F '#{session_name}' | grep -vxF \"$(tmux display-message -p '#S')\" | fzf --reverse | xargs -r tmux switch-client -t"

bind d detach-client

bind-key C-n command-prompt \
    -p "New session name:" \
    "new-session -s '%%'"

set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

