include ~/.config/kitty/black_metal_gorgoroth.conf

allow_remote_control yes

confirm_os_window_close 0

map super+u           set_background_opacity 1
map super+shift+u     set_background_opacity default
map super+shift+i     set_background_opacity 0.9

font_family Iosevka Term
font_size 14
text_composition_strategy legacy
modify_font cell_width 95%

shell_integration no-cursor
enable_audio_bell no

dynamic_background_opacity yes
hide_window_decorations yes
window_padding_width 0
window_padding_height 0
background_blur 10
placement_strategy top

cursor_shape block
cursor_blink_interval 0
cursor_trail 15
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.2

background_opacity 0.8
set_background_opacity 1

map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

enabled_layouts splits
map ctrl+v launch --location=vsplit --cwd=current
map ctrl+s launch --location=hsplit --cwd=current

map ctrl+w close_window

map ctrl+space next_layout

