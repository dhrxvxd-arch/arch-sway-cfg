include ~/.config/kitty/black_metal_gorgoroth.conf

allow_remote_control yes

confirm_os_window_close 0

map ctrl+u           set_background_opacity 1
map ctrl+i           set_background_opacity 0.8

font_family Iosevka Nerd Font
font_size 13
text_composition_strategy legacy
modify_font cell_width 95%

shell_integration no-cursor
enable_audio_bell no

dynamic_background_opacity yes
hide_window_decorations yes
window_padding_width 0
window_padding_height 0
background_blur 10
placement_strategy top
background_opacity 1
window_padding_width 4

cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_start_threshold 1
cursor_trail_decay 0.1 0.5
custom_shaders cursor-trail-motion-blur

#map ctrl+shift+h neighboring_window left
#map ctrl+shift+j neighboring_window down
#map ctrl+shift+k neighboring_window up
#map ctrl+shift+l neighboring_window right

#enabled_layouts splits
#map ctrl+v launch --location=vsplit --cwd=current
#map ctrl+s launch --location=hsplit --cwd=current

#map ctrl+w close_window

#map ctrl+space next_layout

